<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> RAG — Chat with your Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #fafafa;
      --panel-bg: #f4f4f6;
      --border: #e6e6ea;
      --text: #17171c;
      --text-muted: #75757f;
      --text-faint: #a3a3ac;
      --accent: #6C5CE7;
      --accent-dark: #5A4BD1;
      --accent-light: #EEECFD;
      --accent-user: #6C5CE7;
      --danger: #d64545;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .brand {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .brand-sub {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .side-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .side-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    select,
    input[type=password],
    input[type=text] {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      background: #fff;
    }

    .dropzone:hover,
    .dropzone.drag {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .dropzone svg {
      margin-bottom: 6px;
      color: var(--text-faint);
    }

    .dropzone .dz-title {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .dropzone .dz-sub {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .dropzone.drag .dz-title {
      color: var(--accent-dark);
    }

    .library-label {
      justify-content: space-between;
    }

    .library-count {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text-muted);
    }

    .library-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .library-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: #fff;
      border: 1px solid var(--border);
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
    }

    .library-item:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      transform: translateX(1px);
    }

    .library-item .lib-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 6px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .library-item .lib-body {
      min-width: 0;
      flex: 1;
    }

    .library-item .lib-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-item .lib-meta {
      font-size: 10px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      margin-top: 1px;
    }

    .library-item .lib-open {
      flex-shrink: 0;
      color: var(--text-faint);
      opacity: 0;
      transition: opacity .15s;
    }

    .library-item:hover .lib-open {
      opacity: 1;
      color: var(--accent-dark);
    }

    .empty-hint {
      font-size: 12px;
      color: var(--text-faint);
      padding: 4px 0;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .reset-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: .15s;
    }

    .reset-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .env-pill {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-faint);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ---------- Main ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }

    .topbar .top-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .clear-btn:hover {
      background: var(--panel-bg);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .messages:empty::before {
      content: 'Ask a question about your ingested transcripts to get started.';
      color: var(--text-faint);
      font-size: 13px;
      margin: auto;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: 78%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .avatar.bot {
      background: var(--panel-bg);
    }

    .avatar.user {
      background: var(--accent-user);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
    }

    .bubble {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.6;
    }

    .msg-row.bot .bubble {
      background: var(--panel-bg);
      color: var(--text);
      border-top-left-radius: 4px;
    }

    .msg-row.user .bubble {
      background: var(--accent-user);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg-row.error .bubble {
      background: #fdecec;
      color: var(--danger);
    }

    /* ---------- Markdown rendering inside bot bubbles ---------- */
    .bubble.md>*:first-child {
      margin-top: 0;
    }

    .bubble.md>*:last-child {
      margin-bottom: 0;
    }

    .bubble.md h1,
    .bubble.md h2,
    .bubble.md h3,
    .bubble.md h4 {
      font-weight: 700;
      line-height: 1.35;
      margin: 14px 0 6px;
    }

    .bubble.md h1 {
      font-size: 16.5px;
    }

    .bubble.md h2 {
      font-size: 15.5px;
    }

    .bubble.md h3 {
      font-size: 14.5px;
    }

    .bubble.md h4 {
      font-size: 13.5px;
    }

    .bubble.md p {
      margin: 0 0 10px;
    }

    .bubble.md ul,
    .bubble.md ol {
      margin: 0 0 10px;
      padding-left: 20px;
    }

    .bubble.md li {
      margin-bottom: 4px;
    }

    .bubble.md li>ul,
    .bubble.md li>ol {
      margin-top: 4px;
      margin-bottom: 0;
    }

    .bubble.md strong {
      font-weight: 700;
    }

    .bubble.md em {
      font-style: italic;
    }

    .bubble.md a {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    .bubble.md code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0, 0, 0, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .bubble.md pre {
      background: #1e1e24;
      color: #f0f0f5;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: 0 0 10px;
    }

    .bubble.md pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: 12px;
    }

    .bubble.md blockquote {
      margin: 0 0 10px;
      padding: 4px 12px;
      border-left: 3px solid var(--accent);
      color: var(--text-muted);
    }

    .bubble.md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .bubble.md table {
      border-collapse: collapse;
      margin: 0 0 10px;
      font-size: 12.5px;
      width: 100%;
    }

    .bubble.md th,
    .bubble.md td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      text-align: left;
    }

    .bubble.md th {
      background: rgba(0, 0, 0, 0.04);
      font-weight: 600;
    }

    .sources-toggle {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--accent-dark);
      cursor: pointer;
      user-select: none;
    }

    .sources-toggle svg {
      transition: transform .15s;
    }

    .sources-toggle.open svg {
      transform: rotate(180deg);
    }

    .sources-panel {
      display: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sources-panel.open {
      display: flex;
    }

    .source-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent-dark);
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s, background .15s;
    }

    .source-chip:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .source-chip .sc-icon {
      flex-shrink: 0;
      font-size: 13px;
    }

    .source-chip .sc-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .composer {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--border);
    }

    .composer-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 6px 6px 18px;
      background: #fff;
    }

    .composer-inner:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .composer-inner input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13.5px;
      padding: 8px 0;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--panel-bg);
      color: var(--text-muted);
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }

    .send-btn:hover {
      background: var(--accent-dark);
    }

    .send-btn:disabled {
      background: var(--text-faint);
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #dcdce2;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    @media (max-width:760px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -280px;
        height: 100%;
        transition: left .2s;
      }

      .sidebar.open {
        left: 0;
        box-shadow: 0 0 30px rgba(0, 0, 0, .15);
      }

      .menu-btn {
        display: flex;
      }

      .msg-row {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-title"><span class="dot"></span>RAG</div>
        <div class="brand-sub">Hybrid Retrieval · Reranking</div>
      </div>

      <div class="side-section">
        <div class="side-label">Configuration</div>
        <div class="field">
          <label for="providerSelect">LLM Provider</label>
          <select id="providerSelect">
            <option value="ollama">ollama (qwen2.5:3b)</option>
          </select>
        </div>
        <div class="field">
          <label for="llmKey">LLM API Key</label>
          <input type="password" id="llmKey" placeholder="sk-..." autocomplete="off" />
        </div>
        <div class="field">
          <label for="apiKey">FastAPI Key</label>
          <input type="password" id="apiKey" placeholder="x-api-key" autocomplete="off" />
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">Add to Library</div>
        <div class="dropzone" id="dropzone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4" />
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
          <div class="dz-title" id="dzTitle">Drop .pdf / .txt files here</div>
          <div class="dz-sub">or click to browse</div>
          <input type="file" id="fileInput" accept=".pdf,.txt" multiple hidden />
        </div>
      </div>

      <div class="side-section library-section" style="border-bottom:none;">
        <div class="side-label library-label">
          <span>Library</span>
          <span class="library-count" id="libraryCount">0 files</span>
        </div>
        <div class="library-list" id="transcriptList">
          <div class="empty-hint">No files in your library yet. Upload one above.</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="reset-btn" id="resetBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
          Reset All
        </button>
        <span class="env-pill" id="envPill">–</span>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <div class="topbar">
        <div>
          <h1>Chat with your RAG</h1>
          <div class="top-sub" id="topSub">0 transcripts loaded</div>
        </div>
        <button class="clear-btn" id="clearChatBtn">Clear chat</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="composer-inner">
          <input type="text" id="queryInput" placeholder="Ask anything across all transcripts…" />
          <button class="icon-btn" id="topKBtn" title="Results per query">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v4l3 2" />
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      // ---- Config: same-origin API, adjust if the API is hosted elsewhere ----
      const API_BASE = "";

      const els = {
        dropzone: document.getElementById('dropzone'),
        dzTitle: document.getElementById('dzTitle'),
        fileInput: document.getElementById('fileInput'),
        transcriptList: document.getElementById('transcriptList'),
        libraryCount: document.getElementById('libraryCount'),
        topSub: document.getElementById('topSub'),
        messages: document.getElementById('messages'),
        queryInput: document.getElementById('queryInput'),
        sendBtn: document.getElementById('sendBtn'),
        clearChatBtn: document.getElementById('clearChatBtn'),
        resetBtn: document.getElementById('resetBtn'),
        providerSelect: document.getElementById('providerSelect'),
        llmKey: document.getElementById('llmKey'),
        apiKey: document.getElementById('apiKey'),
        envPill: document.getElementById('envPill'),
        toast: document.getElementById('toast'),
      };

      let sessionId = null; // assigned by the backend on first /chat response
      let sources = [];     // {name, chunks}

      // ---------------- helpers ----------------
      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2600);
      }

      function headers(json) {
        const h = {};
        if (json) h["Content-Type"] = "application/json";
        const key = els.apiKey.value.trim();
        if (key) h["x-api-key"] = key;
        return h;
      }

      function fileIcon(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'pdf') return '📕';
        if (ext === 'docx') return '📘';
        return '📄';
      }

      function renderStats() {
        const totalChunks = sources.reduce((s, x) => s + (x.chunks || 0), 0);
        els.libraryCount.textContent =
          `${sources.length} file${sources.length === 1 ? '' : 's'} · ${totalChunks} chunk${totalChunks === 1 ? '' : 's'}`;
        els.topSub.textContent = `${sources.length} transcript${sources.length === 1 ? '' : 's'} loaded`;
      }

      // Renders the sidebar as a real library: each ingested file is a
      // clickable card that opens the original document via /files/{name},
      // rather than an inert row of stats.
      function renderTranscripts() {
        if (!sources.length) {
          els.transcriptList.innerHTML = '<div class="empty-hint">No files in your library yet. Upload one above.</div>';
          return;
        }
        els.transcriptList.innerHTML = sources.map(s => `
      <a class="library-item" href="${API_BASE}/files/${encodeURIComponent(s.name)}" target="_blank" rel="noopener noreferrer" title="Open ${escapeHtml(s.name)}">
        <span class="lib-icon">${fileIcon(s.name)}</span>
        <span class="lib-body">
          <div class="lib-name">${escapeHtml(s.name)}</div>
          <div class="lib-meta">${s.chunks} chunk${s.chunks === 1 ? '' : 's'}</div>
        </span>
        <svg class="lib-open" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <path d="M15 3h6v6" /><path d="M10 14L21 3" />
        </svg>
      </a>
    `).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function scrollToBottom() {
        els.messages.scrollTop = els.messages.scrollHeight;
      }

      // ---------------- minimal markdown renderer ----------------
      // Deliberately dependency-free: escapes all input first, then applies a
      // small set of markdown transforms. Safe against HTML/script injection
      // from LLM output since escaping always happens before any tag is added.
      function renderMarkdown(raw) {
        const src = String(raw ?? '');

        // 1) Pull out fenced code blocks first so nothing inside them gets
        //    mangled by later inline rules, then escape their contents.
        const codeBlocks = [];
        let text = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
          const idx = codeBlocks.length;
          codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
          return `\u0000CODEBLOCK${idx}\u0000`;
        });

        // 2) Escape everything else so raw HTML in the response can't render.
        text = escapeHtml(text);

        // 3) Inline code spans.
        text = text.replace(/`([^`\n]+)`/g, (_, code) => `<code>${code}</code>`);

        // 4) Headings.
        text = text.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
        text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
        text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
        text = text.replace(/^# (.*)$/gm, '<h1>$1</h1>');

        // 5) Bold / italic (bold before italic to avoid ** eating into *).
        text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // 6) Links [text](url) — only allow http(s) targets.
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // 7) Blockquotes.
        text = text.replace(/^&gt; ?(.*)$/gm, '<blockquote>$1</blockquote>');
        text = text.replace(/(<\/blockquote>)\n(<blockquote>)/g, '$1$2');

        // 8) Horizontal rules.
        text = text.replace(/^(---|\*\*\*|___)$/gm, '<hr>');

        // 9) Lists — group consecutive bullet/numbered lines into <ul>/<ol>.
        const lines = text.split('\n');
        const out = [];
        let listType = null; // 'ul' | 'ol' | null
        let para = [];

        function flushPara() {
          if (para.length) {
            out.push(`<p>${para.join('<br>')}</p>`);
            para = [];
          }
        }
        function closeList() {
          if (listType) {
            out.push(`</${listType}>`);
            listType = null;
          }
        }

        for (const line of lines) {
          const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
          const numbered = line.match(/^\s*\d+\.\s+(.*)$/);

          if (bullet) {
            flushPara();
            if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
            out.push(`<li>${bullet[1]}</li>`);
          } else if (numbered) {
            flushPara();
            if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
            out.push(`<li>${numbered[1]}</li>`);
          } else if (line.trim() === '') {
            closeList();
            flushPara();
          } else if (/^<(h[1-4]|hr|blockquote|pre)/.test(line.trim())) {
            closeList();
            flushPara();
            out.push(line);
          } else {
            closeList();
            para.push(line);
          }
        }
        closeList();
        flushPara();
        text = out.join('\n');

        // 10) Restore fenced code blocks.
        text = text.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_, i) => codeBlocks[Number(i)]);

        return text;
      }

      // ---------------- health check ----------------
      async function checkHealth() {
        console.debug('[ui] Checking backend health', API_BASE);
        try {
          const res = await fetch(`${API_BASE}/health`);
          if (!res.ok) throw new Error('health check failed');
          const data = await res.json();
          console.debug('[ui] Health response', data);
          els.envPill.textContent = data.env || 'unknown';
        } catch (e) {
          console.debug('[ui] Health check failed', e);
          els.envPill.textContent = 'offline';
        }
      }

      // ---------------- ingest ----------------
      async function ingestFiles(fileList) {
        for (const file of fileList) {
          console.debug('[ui] Starting ingest', file.name, file.size, 'bytes');
          const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
          if (!['.pdf', '.txt'].includes(ext)) {
            showToast(`Unsupported file type: ${ext}`);
            continue;
          }
          els.dzTitle.textContent = `Ingesting ${file.name}…`;
          const form = new FormData();
          form.append('file', file);
          try {
            const res = await fetch(`${API_BASE}/ingest`, {
              method: 'POST',
              headers: headers(false),
              body: form,
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({ detail: res.statusText }));
              throw new Error(err.detail || 'Ingestion failed');
            }
            const data = await res.json();
            console.debug('[ui] Ingest response', data);
            sources.push({ name: data.source, chunks: data.chunks });
            renderTranscripts();
            renderStats();
            showToast(data.cached ? `${data.source} already indexed` : `Ingested ${data.source} (${data.chunks} chunks)`);
          } catch (err) {
            console.debug('[ui] Ingest failed', file.name, err);
            showToast(`Error: ${err.message}`);
          }
        }
        els.dzTitle.textContent = 'Drop .srt / .txt files here';
      }

      els.dropzone.addEventListener('click', () => els.fileInput.click());
      els.fileInput.addEventListener('change', e => {
        if (e.target.files.length) ingestFiles(e.target.files);
        e.target.value = '';
      });
      ['dragenter', 'dragover'].forEach(evt =>
        els.dropzone.addEventListener(evt, e => { e.preventDefault(); els.dropzone.classList.add('drag'); })
      );
      ['dragleave', 'drop'].forEach(evt =>
        els.dropzone.addEventListener(evt, e => { e.preventDefault(); els.dropzone.classList.remove('drag'); })
      );
      els.dropzone.addEventListener('drop', e => {
        if (e.dataTransfer.files.length) ingestFiles(e.dataTransfer.files);
      });

      // ---------------- chat rendering ----------------
      function addUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `
      <div class="avatar user">You</div>
      <div class="bubble"></div>
    `;
        row.querySelector('.bubble').textContent = text;
        els.messages.appendChild(row);
        scrollToBottom();
      }

      function addTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.id = 'typingRow';
        row.innerHTML = `
      <div class="avatar bot">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
        els.messages.appendChild(row);
        scrollToBottom();
      }

      function removeTypingIndicator() {
        const row = document.getElementById('typingRow');
        if (row) row.remove();
      }

      function addBotMessage(text, srcList, isError) {
        const row = document.createElement('div');
        row.className = 'msg-row bot' + (isError ? ' error' : '');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (isError) {
          bubble.textContent = text;
        } else {
          bubble.classList.add('md');
          bubble.innerHTML = renderMarkdown(text);
        }

        const avatar = document.createElement('div');
        avatar.className = 'avatar bot';
        avatar.textContent = isError ? '⚠️' : '🎙️';

        row.appendChild(avatar);

        const col = document.createElement('div');
        col.style.display = 'flex';
        col.style.flexDirection = 'column';
        col.style.minWidth = '0';
        col.appendChild(bubble);

        if (srcList && srcList.length) {
          // Dedupe by source name — a bot answer may cite the same file
          // multiple times across different chunks.
          const uniqueNames = [...new Set(srcList.map(s => s.source))];

          const toggle = document.createElement('div');
          toggle.className = 'sources-toggle';
          toggle.innerHTML = `<span>${uniqueNames.length} Source${uniqueNames.length === 1 ? '' : 's'}</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>`;
          const panel = document.createElement('div');
          panel.className = 'sources-panel';
          panel.innerHTML = uniqueNames.map(name => `
        <a class="source-chip" href="${API_BASE}/files/${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">
          <span class="sc-icon">📄</span><span class="sc-name">${escapeHtml(name)}</span>
        </a>
      `).join('');
          toggle.addEventListener('click', () => {
            toggle.classList.toggle('open');
            panel.classList.toggle('open');
          });
          col.appendChild(toggle);
          col.appendChild(panel);
        }

        row.appendChild(col);
        els.messages.appendChild(row);
        scrollToBottom();
      }

      // ---------------- send query ----------------
      async function sendQuery() {
        const query = els.queryInput.value.trim();
        if (!query) return;
        console.debug('[ui] Sending chat query', { query, sessionId });
        els.queryInput.value = '';
        els.sendBtn.disabled = true;
        addUserMessage(query);
        addTypingIndicator();

        try {
          const res = await fetch(`${API_BASE}/chat`, {
            method: 'POST',
            headers: headers(true),
            body: JSON.stringify({
              session_id: sessionId,
              query,
              top_k: 5,
              provider: els.providerSelect.value,
              llm_api_key: els.llmKey.value.trim(),
            }),
          });
          removeTypingIndicator();
          if (!res.ok) {
            const err = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(err.detail || 'Request failed');
          }
          const data = await res.json();
          console.debug('[ui] Chat response', { sources: (data.sources || []).length, sessionId: data.session_id });
          sessionId = data.session_id || sessionId;
          addBotMessage(data.answer, data.sources || []);
        } catch (err) {
          console.debug('[ui] Chat request failed', err);
          removeTypingIndicator();
          addBotMessage(`Something went wrong: ${err.message}`, null, true);
        } finally {
          els.sendBtn.disabled = false;
          els.queryInput.focus();
        }
      }

      els.sendBtn.addEventListener('click', sendQuery);
      els.queryInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendQuery();
      });

      // ---------------- clear / reset ----------------
      els.clearChatBtn.addEventListener('click', async () => {
        console.debug('[ui] Clearing chat', sessionId);
        els.messages.innerHTML = '';
        if (sessionId) {
          try {
            await fetch(`${API_BASE}/chat/${sessionId}`, { method: 'DELETE', headers: headers(false) });
          } catch (e) { console.debug('[ui] Clear request failed', e); }
          sessionId = null;
        }
        showToast('Chat cleared');
      });

      els.resetBtn.addEventListener('click', async () => {
        console.debug('[ui] Resetting UI', sessionId);
        els.messages.innerHTML = '';
        sources = [];
        renderTranscripts();
        renderStats();
        if (sessionId) {
          try {
            await fetch(`${API_BASE}/chat/${sessionId}`, { method: 'DELETE', headers: headers(false) });
          } catch (e) { console.debug('[ui] Reset request failed', e); }
          sessionId = null;
        }
        showToast('Reset — note: this clears the UI only, the index on disk is unchanged.');
      });

      // ---------------- init ----------------
      checkHealth();
      renderTranscripts();
      renderStats();
    })();
  </script>
</body>

</html>
